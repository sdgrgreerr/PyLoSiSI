[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pylosisi"
version = "0.1.0"
authors = [
  { name="sdgrgreerr", email="maxim.fry.a@gmail.com" },
]
description = "Audio modem protocol implementation for LoSiSi (Low-Signal Simple Interface)"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Communications :: Ham Radio",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "numpy>=1.20.0",
]

[project.optional-dependencies]
stream = [
    "sounddevice>=0.4.6",
]

[project.urls]
Homepage = "https://github.com"
